services:
  # ---------------------------------------------------------------------------
  # FastAPI Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: posting-pipeline-backend
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: pipeline-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: posting-pipeline-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: PROCESSED_DIR
        value: /var/data/processed
      - key: LOG_DIR
        value: /var/data/logs
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: models/gemini-1.5-flash-latest
      - key: API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON
        sync: false
      - key: WORKER_SSH_HOST
        sync: false
      - key: WORKER_SSH_PORT
        value: "22"
      - key: WORKER_SSH_USER
        value: ubuntu
      - key: WORKER_SSH_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ADMIN_USERNAME
        value: adminn
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"

# -----------------------------------------------------------------------------
# Managed PostgreSQL Database
# -----------------------------------------------------------------------------
databases:
  - name: posting-pipeline-db
    databaseName: posting_pipeline
    user: posting_user
    region: oregon
    plan: free
